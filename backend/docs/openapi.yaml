openapi: 3.0.3
info:
  title: Movie App API
  version: 1.0.0
  description: REST API for the Movie App — authentication, movies, genres, ratings, reviews, and user lists.

servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:          { type: integer, example: 1 }
        name:        { type: string,  example: "Alice" }
        email:       { type: string,  format: email, example: "alice@example.com" }
        role:        { type: string,  enum: [USER, ADMIN], example: "USER" }
        avatarUrl:   { type: string,  nullable: true, example: "https://res.cloudinary.com/..." }
        createdAt:   { type: string,  format: date-time }

    Movie:
      type: object
      properties:
        id:              { type: integer, example: 1 }
        title:           { type: string,  example: "Inception" }
        synopsis:        { type: string,  example: "A thief who steals corporate secrets through dreams." }
        posterUrl:       { type: string,  nullable: true }
        moviePictureUrl: { type: string,  nullable: true }
        releaseYear:     { type: string,  format: date-time }
        averageRating:   { type: number,  example: 4.2 }
        ratingCount:     { type: integer, example: 87 }
        createdAt:       { type: string,  format: date-time }
        updatedAt:       { type: string,  format: date-time }
        genres:
          type: array
          items: { $ref: '#/components/schemas/Genre' }

    Genre:
      type: object
      properties:
        id:   { type: integer, example: 1 }
        name: { type: string,  example: "Action" }

    Rating:
      type: object
      properties:
        id:        { type: integer, example: 1 }
        userId:    { type: integer, example: 1 }
        movieId:   { type: integer, example: 5 }
        value:     { type: integer, minimum: 1, maximum: 5, example: 4 }
        createdAt: { type: string,  format: date-time }
        updatedAt: { type: string,  format: date-time }

    Review:
      type: object
      properties:
        id:      { type: integer, example: 1 }
        userId:  { type: integer, example: 1 }
        movieId: { type: integer, example: 5 }
        content: { type: string,  example: "Brilliant film with stunning visuals." }

    UserMovie:
      type: object
      properties:
        id:        { type: integer, example: 1 }
        userId:    { type: integer, example: 1 }
        movieId:   { type: integer, example: 5 }
        status:    { type: string,  enum: [WATCHLIST, WATCHED, FAVORITE], example: "WATCHLIST" }
        createdAt: { type: string,  format: date-time }
        updatedAt: { type: string,  format: date-time }

    PaginatedMovies:
      type: object
      properties:
        movies:
          type: array
          items: { $ref: '#/components/schemas/Movie' }
        total:      { type: integer, example: 42 }
        totalPages: { type: integer, example: 3 }
        hasNext:    { type: boolean, example: true }

    Error:
      type: object
      properties:
        error: { type: string, example: "Unauthorized" }

tags:
  - name: Auth
  - name: Movies
  - name: Genres
  - name: Ratings
  - name: Reviews
  - name: User Movies
  - name: Users

paths:

  # ─── AUTH ───────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:     { type: string,  example: "Alice" }
                email:    { type: string,  format: email, example: "alice@example.com" }
                password: { type: string,  minLength: 6, example: "secret123" }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { description: Validation error }
        '409': { description: Email already registered }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in (rate-limited to 10 requests / 60 s per IP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email, example: "alice@example.com" }
                password: { type: string, example: "secret123" }
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: "eyJhbGciOiJIUzI1NiIs..." }
        '400': { description: Validation error }
        '401': { description: Invalid credentials }
        '429': { description: Too many requests }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: Always returns 200 regardless of whether the email exists (prevents user enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: "alice@example.com" }
      responses:
        '200':
          description: Reset link sent (if account exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "If this email exists, a reset link has been sent." }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a token from email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:       { type: string, example: "a3f9..." }
                newPassword: { type: string, minLength: 6, example: "newSecret123" }
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Password reset successfully" }
        '400': { description: Invalid or expired token }

  # ─── MOVIES ─────────────────────────────────────────────────────────────────

  /movies:
    get:
      tags: [Movies]
      summary: Get paginated list of movies
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: sortBy
          schema: { type: string, enum: [title, releaseYear], default: title }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
        - in: query
          name: genreId
          schema: { type: integer }
          description: Filter by genre ID
      responses:
        '200':
          description: Paginated movies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedMovies' }
        '401': { description: Unauthorized }

    post:
      tags: [Movies]
      summary: Create a movie (ADMIN only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, synopsis, releaseYear]
              properties:
                title:       { type: string, minLength: 3, maxLength: 100, example: "Inception" }
                synopsis:    { type: string, minLength: 3, maxLength: 1000, example: "A thief who steals corporate secrets." }
                posterUrl:   { type: string, format: uri, example: "https://example.com/poster.jpg", description: "Optional" }
                releaseYear: { type: string, format: date, example: "2010-07-16" }
                genres:
                  type: array
                  description: "Optional"
                  items:
                    type: object
                    properties:
                      genreId: { type: integer, example: 1 }
      responses:
        '201':
          description: Movie created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Forbidden — ADMIN role required }

  /movies/search:
    get:
      tags: [Movies]
      summary: Search movies by title
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: title
          required: true
          schema: { type: string, example: "Inception" }
      responses:
        '200':
          description: Matching movies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Movie' }
        '400': { description: title query param is required }
        '401': { description: Unauthorized }

  /movies/{id}:
    get:
      tags: [Movies]
      summary: Get a movie by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Movie found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '401': { description: Unauthorized }
        '404': { description: Movie not found }

    patch:
      tags: [Movies]
      summary: Update a movie (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:       { type: string, minLength: 3, maxLength: 100 }
                synopsis:    { type: string, minLength: 3, maxLength: 1000 }
                posterUrl:   { type: string, format: uri }
                releaseYear: { type: string, format: date }
                genres:
                  type: array
                  items:
                    type: object
                    properties:
                      genreId: { type: integer }
      responses:
        '200':
          description: Movie updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden — ADMIN role required }
        '404': { description: Movie not found }

    delete:
      tags: [Movies]
      summary: Delete a movie (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Movie deleted }
        '401': { description: Unauthorized }
        '403': { description: Forbidden — ADMIN role required }
        '404': { description: Movie not found }

  /movies/{id}/poster:
    patch:
      tags: [Movies]
      summary: Upload a movie poster image (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                poster:
                  type: string
                  format: binary
      responses:
        '200':
          description: Poster uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl: { type: string, example: "https://res.cloudinary.com/..." }
        '400': { description: No file uploaded }
        '401': { description: Unauthorized }
        '403': { description: Forbidden — ADMIN role required }

  # ─── GENRES ─────────────────────────────────────────────────────────────────

  /genres:
    get:
      tags: [Genres]
      summary: Get all genres (public)
      responses:
        '200':
          description: List of genres
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Genre' }

    post:
      tags: [Genres]
      summary: Create a genre (ADMIN only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Sci-Fi" }
      responses:
        '201':
          description: Genre created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Genre' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Forbidden — ADMIN role required }

  /genres/{id}:
    get:
      tags: [Genres]
      summary: Get a genre by ID (public)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Genre found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Genre' }
        '404': { description: Genre not found }

    patch:
      tags: [Genres]
      summary: Update a genre (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Thriller" }
      responses:
        '200':
          description: Genre updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Genre' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden — ADMIN role required }
        '404': { description: Genre not found }

    delete:
      tags: [Genres]
      summary: Delete a genre (auth required)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Genre deleted }
        '401': { description: Unauthorized }
        '404': { description: Genre not found }

  # ─── RATINGS ────────────────────────────────────────────────────────────────

  /ratings:
    get:
      tags: [Ratings]
      summary: Get ratings for a movie
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: movieId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: List of ratings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rating' }
        '400': { description: movieId is required }
        '401': { description: Unauthorized }

    post:
      tags: [Ratings]
      summary: Rate a movie
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movieId, value]
              properties:
                movieId: { type: integer, example: 5 }
                value:   { type: integer, minimum: 1, maximum: 5, example: 4 }
      responses:
        '201':
          description: Rating created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rating' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '409': { description: Already rated this movie }

  /ratings/{id}:
    patch:
      tags: [Ratings]
      summary: Update a rating
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: integer, minimum: 1, maximum: 5, example: 5 }
      responses:
        '200':
          description: Rating updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rating' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Rating not found }

    delete:
      tags: [Ratings]
      summary: Delete a rating
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Rating deleted }
        '401': { description: Unauthorized }
        '404': { description: Rating not found }

  # ─── REVIEWS ────────────────────────────────────────────────────────────────

  /reviews:
    get:
      tags: [Reviews]
      summary: Get reviews for a movie
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: movieId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
        '400': { description: movieId is required }
        '401': { description: Unauthorized }

    post:
      tags: [Reviews]
      summary: Write a review
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movieId, content]
              properties:
                movieId: { type: integer, example: 5 }
                content: { type: string, minLength: 3, maxLength: 2000, example: "A masterpiece of modern cinema." }
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }

  /reviews/{id}:
    patch:
      tags: [Reviews]
      summary: Update a review
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Review not found }

    delete:
      tags: [Reviews]
      summary: Delete a review
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Review deleted }
        '401': { description: Unauthorized }
        '404': { description: Review not found }

  # ─── USER MOVIES ─────────────────────────────────────────────────────────────

  /user-movies:
    get:
      tags: [User Movies]
      summary: Get the current user's movie list
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [WATCHLIST, WATCHED, FAVORITE] }
          description: Filter by status (omit to get all)
      responses:
        '200':
          description: User's movie list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserMovie' }
        '401': { description: Unauthorized }

    post:
      tags: [User Movies]
      summary: Add a movie to the current user's list
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movieId, status]
              properties:
                movieId: { type: integer, example: 5 }
                status:  { type: string, enum: [WATCHLIST, WATCHED, FAVORITE], example: "WATCHLIST" }
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMovie' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Movie not found }
        '409': { description: Movie already in list with this status }

  /user-movies/{id}:
    patch:
      tags: [User Movies]
      summary: Update the status of a list entry
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [WATCHLIST, WATCHED, FAVORITE], example: "WATCHED" }
      responses:
        '200':
          description: Entry updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMovie' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Entry not found }

    delete:
      tags: [User Movies]
      summary: Remove a movie from the current user's list
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Entry removed }
        '401': { description: Unauthorized }
        '404': { description: Entry not found }

  # ─── USERS ──────────────────────────────────────────────────────────────────

  /users:
    get:
      tags: [Users]
      summary: Get all users (public)
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }

    post:
      tags: [Users]
      summary: Create a user (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:     { type: string,  example: "Alice" }
                email:    { type: string,  format: email, example: "alice@example.com" }
                password: { type: string,  example: "secret123" }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { description: Email already taken or invalid data }

  /users/me/avatar:
    patch:
      tags: [Users]
      summary: Upload the current user's avatar
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '201':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl: { type: string, example: "https://res.cloudinary.com/..." }
        '400': { description: No file uploaded }
        '401': { description: Unauthorized }

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID (public)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { description: User not found }

    put:
      tags: [Users]
      summary: Update a user (public)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:     { type: string }
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { description: User not found }

    delete:
      tags: [Users]
      summary: Delete a user (public)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: User deleted }
        '404': { description: User not found }
